kind = "web"
previewPath = "/"
title = "ColorStack UTD"
version = "1.0.0"
id = "artifacts/colorstack-utd"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19958

[services.development]
run = "pnpm --filter @workspace/colorstack-utd run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/colorstack-utd", "run", "build" ]
publicDir = "artifacts/colorstack-utd/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19958"
BASE_PATH = "/"
